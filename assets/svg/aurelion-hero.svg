<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="hg-title hg-desc">
<title id="hg-title">AURELION: intelligence should never exist inside one mind</title>
<desc id="hg-desc">An amber targeting display. AURELION in glowing letters inside a targeting ring, the tagline, TARGET LOCK ENGAGED, and the readouts LINK ONLINE, MODE: AUTO and UNDO READY.</desc>
<style>
text { font-family: "SF Mono", Menlo, Consolas, monospace; }
.hg-title { font-size: 88px; font-weight: 700; letter-spacing: 26px; fill: #FFB300; }
.hg-tag { font-size: 15px; letter-spacing: 6px; fill: #F8DFAC; }
.hg-lock { font-size: 13px; letter-spacing: 4px; fill: #FF5A3C; font-weight: 700; }
.hg-read { font-size: 13px; letter-spacing: 3px; fill: #FFB300; }
.hg-label { font-size: 11px; letter-spacing: 4px; fill: #9C7C48; }
.hg-halo { paint-order: stroke fill; stroke: #070502; stroke-width: 6px; stroke-linejoin: round; }

.hg-flicker { animation: hg-flicker 7s infinite; }
.hg-spin { transform-origin: 0px 0px; animation: hg-spin 90s linear infinite; }
.hg-spin-back { transform-origin: 0px 0px; animation: hg-spin 140s linear infinite reverse; }
.hg-arcs { transform-origin: 0px 0px; animation: hg-spin 24s linear infinite; }
.hg-radar { transform-origin: 0px 0px; animation: hg-spin 6s linear infinite; }
.hg-lockon { transform-origin: 640px 164px; animation: hg-lockon 4s ease-in-out infinite; }
/* The tagline is always painted: a bright read head sweeps over it, so a
   frame where the motion has not started still shows the whole line. */
.hg-head { animation: hg-head 7s cubic-bezier(.45, 0, .55, 1) .4s infinite; }
.hg-head-bar { animation: hg-head-bar 7s cubic-bezier(.45, 0, .55, 1) .4s infinite; }
.hg-sweep { animation: hg-sweep 6s linear infinite; }
.hg-ladder-up { animation: hg-ladder 4s linear infinite; }
.hg-ladder-down { animation: hg-ladder 5s linear infinite reverse; }
.hg-blink { animation: hg-blink 1.6s steps(1, end) infinite; }
.hg-chase { animation: hg-chase 1.5s linear infinite; }
.hg-chase.n2 { animation-delay: .25s; }
.hg-chase.n3 { animation-delay: .5s; }
.hg-of3 { animation: hg-of3 9s infinite; }
.hg-of3.n2 { animation-delay: -6s; }
.hg-of3.n3 { animation-delay: -3s; }
.hg-of2 { animation: hg-of2 8s infinite; }
.hg-of2.n2 { animation-delay: -4s; }
.hg-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: hg-bar 1.3s ease-in-out infinite alternate; }
.hg-bar.n2 { animation-duration: .9s; }
.hg-bar.n3 { animation-duration: 1.7s; }
.hg-bar.n4 { animation-duration: 1.1s; }
.hg-bar.n5 { animation-duration: 1.5s; }

@keyframes hg-spin { to { transform: rotate(360deg); } }
@keyframes hg-flicker { 0%, 91%, 100% { opacity: 1; } 92% { opacity: .55; } 93% { opacity: 1; } 95% { opacity: .78; } 96% { opacity: 1; } }
@keyframes hg-lockon { 0%, 100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.035); opacity: .45; } }
@keyframes hg-head { 0% { transform: translateX(0px); } 36%, 100% { transform: translateX(880px); } }
@keyframes hg-head-bar { 0% { transform: translateX(0px); opacity: 0; } 3%, 33% { opacity: .8; } 36%, 100% { transform: translateX(880px); opacity: 0; } }
@keyframes hg-sweep { from { transform: translateY(0px); } to { transform: translateY(460px); } }
@keyframes hg-ladder { from { transform: translateY(0px); } to { transform: translateY(-48px); } }
@keyframes hg-blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .2; } }
@keyframes hg-chase { 0%, 100% { opacity: .25; } 20% { opacity: 1; } 60% { opacity: .4; } }
@keyframes hg-of3 { 0%, 31% { opacity: 1; } 33.4%, 97.6% { opacity: 0; } 100% { opacity: 1; } }
@keyframes hg-of2 { 0%, 46% { opacity: 1; } 50%, 96% { opacity: 0; } 100% { opacity: 1; } }
@keyframes hg-bar { from { transform: scaleY(.35); } to { transform: scaleY(1); } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}
</style>
<defs>
  <radialGradient id="hg-glow" cx="50%" cy="46%" r="62%">
    <stop offset="0" stop-color="#1C1507"/>
    <stop offset=".5" stop-color="#120D04"/>
    <stop offset="1" stop-color="#070502"/>
  </radialGradient>
  <radialGradient id="hg-vignette" cx="50%" cy="50%" r="72%">
    <stop offset=".45" stop-color="#070502" stop-opacity="0"/>
    <stop offset="1" stop-color="#070502" stop-opacity=".92"/>
  </radialGradient>
  <pattern id="hg-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 .5H.5V40" fill="none" stroke="#3A2A0E" stroke-width="1"/>
  </pattern>
  <pattern id="hg-scan" width="4" height="3" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#FFB300" fill-opacity=".045"/>
  </pattern>
  <pattern id="hg-tick" width="44" height="12" patternUnits="userSpaceOnUse">
    <path d="M0 .5H9" stroke="#9C7C48" stroke-width="1"/>
  </pattern>
  <pattern id="hg-tick-long" width="44" height="48" patternUnits="userSpaceOnUse">
    <path d="M0 .5H20" stroke="#FFB300" stroke-width="1"/>
  </pattern>
  <pattern id="hg-tick-r" width="44" height="12" patternUnits="userSpaceOnUse">
    <path d="M35 .5H44" stroke="#9C7C48" stroke-width="1"/>
  </pattern>
  <pattern id="hg-tick-long-r" width="44" height="48" patternUnits="userSpaceOnUse">
    <path d="M24 .5H44" stroke="#FFB300" stroke-width="1"/>
  </pattern>
  <linearGradient id="hg-fade-v" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".3" stop-color="#fff" stop-opacity="1"/>
    <stop offset=".7" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="hg-ladder-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="360">
    <rect x="0" y="96" width="1280" height="150" fill="url(#hg-fade-v)"/>
  </mask>
  <clipPath id="hg-ladder-clip">
    <rect x="0" y="96" width="1280" height="150"/>
  </clipPath>
  <linearGradient id="hg-band" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFB300" stop-opacity="0"/>
    <stop offset=".88" stop-color="#FFB300" stop-opacity=".07"/>
    <stop offset="1" stop-color="#FFE68F" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="hg-wedge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFB300" stop-opacity="0"/>
    <stop offset="1" stop-color="#FFB300" stop-opacity=".22"/>
  </linearGradient>
  <!-- The read head: a soft window that starts left of the tagline and
       ends right of it, so at rest it lights nothing. -->
  <linearGradient id="hg-head-fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".75" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="hg-head-mask" maskUnits="userSpaceOnUse" x="0" y="214" width="1280" height="52">
    <rect class="hg-head" x="130" y="214" width="150" height="52" fill="url(#hg-head-fade)"/>
  </mask>
  <filter id="hg-bloom" x="-15%" y="-80%" width="130%" height="260%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="near"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="far"/>
    <feMerge>
      <feMergeNode in="far"/>
      <feMergeNode in="near"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="hg-soft" x="-10%" y="-100%" width="120%" height="300%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="1280" height="360" fill="#070502"/>
<rect width="1280" height="360" fill="url(#hg-glow)"/>
<rect width="1280" height="360" fill="url(#hg-grid)" opacity=".42"/>
<rect width="1280" height="360" fill="url(#hg-vignette)"/>

<!-- The targeting ring, centred on the name. -->
<g transform="translate(640 164)" fill="none">
  <g class="hg-radar">
    <path d="M0 0V-98A98 98 0 0 1 63 -75Z" fill="url(#hg-wedge)"/>
    <path d="M0 0L63 -75" stroke="#FFB300" stroke-opacity=".45"/>
  </g>
  <circle r="100" stroke="#3A2A0E"/>
  <g class="hg-spin-back">
    <circle r="116" stroke="#FFB300" stroke-opacity=".38" stroke-width="8" stroke-dasharray="1.2 10.94"/>
    <circle r="116" stroke="#FFB300" stroke-opacity=".7" stroke-width="14" stroke-dasharray="1.6 59.13"/>
  </g>
  <g class="hg-spin">
    <circle r="130" stroke="#FFB300" stroke-opacity=".34" stroke-dasharray="3 9"/>
  </g>
  <g class="hg-arcs">
    <circle r="142" stroke="#FFB300" stroke-opacity=".6" stroke-width="2" stroke-dasharray="148.7 297.4"/>
  </g>
  <path d="M0 -142V-104M0 104V142" stroke="#FFB300" stroke-opacity=".3"/>
  <path d="M-150 0H-170M150 0H170" stroke="#FFB300" stroke-opacity=".5" stroke-width="2"/>
</g>

<!-- Range ladders at both sides. -->
<g mask="url(#hg-ladder-mask)">
  <g clip-path="url(#hg-ladder-clip)">
    <g class="hg-ladder-up">
      <rect x="66" y="96" width="44" height="198" fill="url(#hg-tick)" opacity=".8"/>
      <rect x="66" y="96" width="44" height="198" fill="url(#hg-tick-long)" opacity=".8"/>
    </g>
    <g class="hg-ladder-down">
      <rect x="1170" y="48" width="44" height="198" fill="url(#hg-tick-r)" opacity=".8"/>
      <rect x="1170" y="48" width="44" height="198" fill="url(#hg-tick-long-r)" opacity=".8"/>
    </g>
  </g>
  <path d="M66 96V246M1214 96V246" stroke="#3A2A0E"/>
</g>
<path d="M96 171l-8-5v10zM1184 171l8-5v10z" fill="#FFB300"/>

<!-- Lock-on brackets around the name. -->
<g class="hg-lockon" fill="none" stroke="#FFB300" stroke-width="2" opacity=".8">
  <path d="M318 130V114H336M962 130V114H944M318 198V214H336M962 198V214H944"/>
</g>

<g class="hg-flicker" filter="url(#hg-bloom)">
  <text class="hg-title" x="653" y="196" text-anchor="middle">AURELION</text>
</g>

<text class="hg-tag hg-halo" x="643" y="246" text-anchor="middle">INTELLIGENCE SHOULD NEVER EXIST INSIDE ONE MIND</text>
<g mask="url(#hg-head-mask)" aria-hidden="true">
  <rect x="270" y="227" width="746" height="26" fill="#FFB300" fill-opacity=".16"/>
  <g filter="url(#hg-bloom)">
    <text class="hg-tag" x="643" y="246" text-anchor="middle" style="fill: #FFE68F">INTELLIGENCE SHOULD NEVER EXIST INSIDE ONE MIND</text>
  </g>
</g>
<rect class="hg-head-bar" x="278" y="228" width="2" height="24" fill="#FFE68F" opacity="0"/>

<g filter="url(#hg-soft)">
  <path d="M478 270h-8v20h8M802 270h8v20h-8" fill="none" stroke="#FF5A3C" stroke-width="1.5"/>
  <text class="hg-lock hg-halo" x="642" y="285" text-anchor="middle">TARGET LOCK <tspan class="hg-chase">▸</tspan> <tspan class="hg-chase n2">▸</tspan> <tspan class="hg-chase n3">▸</tspan> ENGAGED</text>
</g>

<!-- Readouts: LINK ONLINE · MODE: AUTO · UNDO READY. The first of each
     set is the still frame; the others take turns when motion is on. -->
<path d="M224 326H560M720 326H1068" stroke="#3A2A0E" stroke-dasharray="2 6"/>
<g filter="url(#hg-soft)">
  <text class="hg-read" x="60" y="331"><tspan class="hg-blink">◉</tspan> LINK ONLINE</text>
  <text class="hg-read hg-of3" x="642" y="331" text-anchor="middle">MODE: AUTO</text>
  <text class="hg-read hg-of3 n2" x="642" y="331" text-anchor="middle" opacity="0">MODE: PLAN</text>
  <text class="hg-read hg-of3 n3" x="642" y="331" text-anchor="middle" opacity="0">MODE: ASK</text>
  <text class="hg-read hg-of2" x="1223" y="331" text-anchor="end">⟲ UNDO READY</text>
  <text class="hg-read hg-of2 n2" x="1223" y="331" text-anchor="end" opacity="0">✓ VERIFIED</text>
</g>

<!-- Header strip. -->
<text class="hg-label" x="60" y="52">◢ TERMINAL AI CODING AGENT</text>
<text class="hg-label" x="1224" y="52" text-anchor="end">MACOS · LINUX</text>
<g fill="#FFB300">
  <rect class="hg-bar" x="1038" y="42" width="4" height="12"/>
  <rect class="hg-bar n2" x="1045" y="42" width="4" height="12"/>
  <rect class="hg-bar n3" x="1052" y="42" width="4" height="12"/>
  <rect class="hg-bar n4" x="1059" y="42" width="4" height="12"/>
  <rect class="hg-bar n5" x="1066" y="42" width="4" height="12"/>
</g>

<!-- Frame and corner brackets. -->
<rect x="16.5" y="16.5" width="1247" height="327" fill="none" stroke="#3A2A0E"/>
<path d="M16 54V16H54M1226 16H1264V54M16 306V344H54M1226 344H1264V306" fill="none" stroke="#FFB300" stroke-width="3"/>

<rect width="1280" height="360" fill="url(#hg-scan)"/>
<rect class="hg-sweep" y="-100" width="1280" height="100" fill="url(#hg-band)"/>
</svg>
